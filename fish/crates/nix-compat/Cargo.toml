[package]
name = "nix-compat"
version = "0.31.1"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

# On Unix the real nix crate is re-exported unchanged. On Windows the subset of the POSIX
# interface that fish uses is implemented over the Win32 API.
[dependencies]
libc.workspace = true

[target.'cfg(unix)'.dependencies]
nix_upstream = { package = "nix", version = "0.31.3", default-features = false, features = [
  "event",
  "fs",
  "hostname",
  "inotify",
  "mman",
  "process",
  "resource",
  "signal",
  "term",
  "user",
] }

[target.'cfg(windows)'.dependencies]
fish-common = { workspace = true }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[lints]
workspace = true
